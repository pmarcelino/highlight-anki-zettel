<!-- Extension icon: the panel's dark tile with one yellow (Anki) and one blue
     (Zettel) highlight stroke. Drawn on a 16-unit grid so every exported size
     (16/32/48/128) lands on whole pixels. Export each size with
     `rsvg-convert -w N -h N icon.svg -o iconN.png`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="3.5" fill="#2b2b2b"/>
  <rect x="3" y="4" width="10" height="3" rx="1.5" fill="#ffe95c"/>
  <rect x="3" y="9" width="6" height="3" rx="1.5" fill="#a6d4ff"/>
</svg>
